<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0;url=https://go.hotmart.com/W107846222E">
    <title>Redirecionando...</title>
    <meta name="robots" content="noindex,nofollow">
    <script>
        (function(){
            var params = new URLSearchParams(window.location.search);
            var gclid = params.get('gclid');
            var utm = params.get('utm_source');
            var url = 'https://go.hotmart.com/W107846222E';
            var extras = [];
            if (gclid) extras.push('gclid=' + encodeURIComponent(gclid));
            if (utm) extras.push('utm_source=' + encodeURIComponent(utm));
            if (extras.length) url += '?' + extras.join('&');
            window.location.replace(url);
        })();
    </script>
    <style>
        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#faf6f0;
            color:#5b3a5e;
            font-family:"DM Sans",system-ui,sans-serif;
            text-align:center;
            padding:24px;
        }
        .box{max-width:420px}
        .box p{margin:0 0 10px;font-size:15px;color:#6f6a73}
        .box a{color:#5b3a5e;font-weight:700;text-decoration:underline}
        .spinner{
            display:inline-block;
            width:22px;height:22px;
            border:3px solid #e8efe9;
            border-top-color:#5b3a5e;
            border-radius:50%;
            animation:spin .8s linear infinite;
            margin-bottom:14px;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner" aria-hidden="true"></div>
        <p>Redirecionando para a página de inscrição segura...</p>
        <p>Se não for redirecionado automaticamente, <a href="https://go.hotmart.com/W107846222E">clique aqui</a>.</p>
    </div>
</body>
</html>
